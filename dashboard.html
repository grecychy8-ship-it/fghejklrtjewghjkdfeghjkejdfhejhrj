<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Client & Student Dashboard - Assignment Dai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="images/fv.png" type="image/x-icon">
  
  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/fontawesome-all.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">

  <div class="dashboard-wrapper">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
      <div class="sidebar-header">
        <a href="#/dashboard" class="sidebar-brand">
          <img src="images/logo1.png" alt="Assignment Dai" style="height: 38px; width: auto; object-fit: contain;">
        </a>
      </div>

      <div class="sidebar-menu">
        <div class="menu-category">MAIN MENU</div>
        <a href="#/dashboard" class="nav-item-link active"><i class="fas fa-home"></i> Dashboard</a>
        <a href="#/projects" class="nav-item-link"><i class="fas fa-file-alt"></i> Assignments</a>
        <a href="#/messages" class="nav-item-link"><i class="fas fa-comments"></i> Messages</a>
        <a href="#/payments" class="nav-item-link"><i class="fas fa-credit-card"></i> Payments & Invoices</a>
        <a href="#/support" class="nav-item-link"><i class="fas fa-life-ring"></i> Issues & Support</a>
        <a href="#/referral" class="nav-item-link"><i class="fas fa-gift"></i> Refer & Earn</a>

        <div class="menu-category mt-3">MANAGEMENT</div>
        <a href="#/profile" class="nav-item-link"><i class="fas fa-user-circle"></i> Profile</a>
      </div>

      <div class="sidebar-footer">
        <a href="#" id="sidebar-logout-btn" class="nav-item-link text-danger mb-0">
          <i class="fas fa-sign-out-alt"></i> Sign Out
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="dashboard-main">
      <!-- TOP NAVBAR -->
      <header class="dashboard-navbar">
        <div class="d-flex align-items-center gap-3">
          <button class="navbar-mobile-toggle" id="mobile-sidebar-toggle" title="Toggle Sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
        </div>

        <div class="navbar-actions">
          <button class="notification-bell-btn" title="Notifications">
            <i class="fas fa-bell"></i>
          </button>

          <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle theme">
            <i class="fas fa-sun"></i>
          </button>
        </div>
      </header>

      <!-- DYNAMIC APP RENDER CONTAINER -->
      <div class="dashboard-container" id="dashboard-app-render">
        <!-- SPA view rendered dynamically via js/dashboard.js -->
      </div>
    </main>

  </div>

  <!-- AUTHENTICATION MODAL DIALOG -->
  <div class="modal fade" id="authModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <ul class="nav nav-tabs border-0" id="authTab" role="tablist">
            <li class="nav-item">
              <a class="nav-link active font-weight-bold h5 mb-0 border-0" id="auth-login-tab" data-toggle="tab" href="#login-pane" role="tab">Sign In</a>
            </li>
            <li class="nav-item">
              <a class="nav-link font-weight-bold h5 mb-0 border-0" id="auth-register-tab" data-toggle="tab" href="#register-pane" role="tab">Register Account</a>
            </li>
          </ul>
        </div>
        <div class="modal-body p-4">
          <div class="tab-content" id="authTabContent">
            <!-- LOGIN PANE -->
            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
              <div class="alert alert-info py-2 px-3 small mb-3">
                <strong>Demo Student Credentials:</strong><br>
                Email: <code>student@demo.com</code> | Password: <code>Password123!</code>
              </div>
              <form id="auth-login-form">
                <div class="form-group">
                  <label>Email Address</label>
                  <input type="email" id="login-email" class="form-control" value="student@demo.com" required>
                </div>
                <div class="form-group">
                  <label>Password</label>
                  <input type="password" id="login-password" class="form-control" value="Password123!" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block rounded-pill font-weight-bold mt-4">Sign In to Dashboard</button>
              </form>
            </div>

            <!-- REGISTER PANE -->
            <div class="tab-pane fade" id="register-pane" role="tabpanel">
              <form id="auth-register-form">
                <div class="form-group">
                  <label>Full Name *</label>
                  <input type="text" id="reg-name" class="form-control" placeholder="e.g. Gareema Sharma" required>
                </div>
                <div class="form-group">
                  <label>Email Address *</label>
                  <input type="email" id="reg-email" class="form-control" placeholder="student@university.edu" required>
                </div>
                <div class="form-group">
                  <label>Password *</label>
                  <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>
                <div class="form-group">
                  <label>Institution / University</label>
                  <input type="text" id="reg-institution" class="form-control" placeholder="e.g. Tribhuvan University / Kathmandu University">
                </div>
                <button type="submit" class="btn btn-success btn-block rounded-pill font-weight-bold mt-4">Create Account & Continue</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies -->
  <script src="js/jquery.js"></script>
  <script src="js/popper.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
